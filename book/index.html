<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eden — Book Your Strategy Session</title>
<meta name="description" content="You're one step away. Pick a time for your Eden strategy session.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0A0B08;
    --bg-raised: #101208;
    --border: rgba(245, 243, 236, 0.09);
    --border-strong: rgba(245, 243, 236, 0.16);
    --gold: #D6A544;
    --gold-soft: rgba(214, 165, 68, 0.12);
    --green: #4A7A5A;
    --ink: #F5F3EC;
    --ink-dim: rgba(245, 243, 236, 0.64);
    --ink-faint: rgba(245, 243, 236, 0.4);
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(214,165,68,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(74,122,90,0.14), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap { max-width: 700px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
  h1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; line-height: 1.1; }

  header { padding: 40px 0 10px; text-align: center; }
  .logo-mark { width: 52px; height: 52px; object-fit: contain; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--green);
    background: rgba(74,122,90,0.14);
    border: 1px solid rgba(74,122,90,0.4);
    padding: 7px 14px;
    border-radius: 999px;
    margin-top: 8px;
  }
  .status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
  }

  .hero { text-align: center; padding: 24px 0 8px; }
  .hero h1 { font-size: clamp(30px, 5vw, 44px); margin-top: 16px; }
  .hero h1 i { color: var(--gold); }
  .hero p { color: var(--ink-dim); font-size: 16px; max-width: 520px; margin: 16px auto 0; }

  section { padding: 32px 0 56px; position: relative; z-index: 1; }
  .calendar-embed-wrap {
    margin: 0 auto;
    max-width: 640px;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    overflow: hidden;
  }
  .calendar-embed-wrap iframe { display: block; min-height: 850px; }
  @media (max-width: 560px) {
    .calendar-embed-wrap iframe { min-height: 1050px; }
  }

  footer { border-top: 1px solid var(--border); padding: 28px 0; text-align: center; }
  footer p { color: var(--ink-faint); font-size: 12.5px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img class="logo-mark" src="../eden-logo.png" alt="Eden">
    <div><span class="status">You're almost in</span></div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Pick a time. <i>That's it.</i></h1>
    <p>Thanks for sharing a bit about your brokerage. Grab a spot below for your strategy session with Eden.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <!-- GHL Calendar: "Strategy Session With EDEN" (calendar ID: eMDrsHSY1MYNLI1g6Jrn) -->
    <div class="calendar-embed-wrap">
      <iframe
        src="https://api.leadconnectorhq.com/widget/booking/eMDrsHSY1MYNLI1g6Jrn"
        style="width: 100%; border: none; overflow: hidden;"
        scrolling="no"
        id="eMDrsHSY1MYNLI1g6Jrn">
      </iframe>
    </div>
  </div>
</section>

<script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>

<footer>
  <p>AI operating systems for real estate teams &amp; brokerages.</p>
</footer>

</body>
</html>
